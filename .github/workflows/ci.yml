name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests experiments

      - name: Format check
        run: uv run ruff format --check src tests experiments

      # E0b's policy-level reduction runs on every commit touching src/rsr/. It is a CI test and
      # not a script on purpose (kickoff decision 3): a reduction that is only checked when someone
      # remembers to check it is not a reduction.
      - name: Tests
        run: uv run pytest -q

      # The ratchet. `--check` reads the floor and refuses a drop; it does not write.
      # Exit 3 (did not run) is not a pass -- see docs/gates.md.
      - name: Test-count floor
        run: uv run rsr floor --check

      - name: Unmeasured-constants ratchet
        run: uv run rsr constants --check
