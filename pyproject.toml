[project]
name = "rsr"
version = "0.1.0"
description = "Retrieval-Successor Retention — a prospective retention policy for the Thought Gestalt architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.scripts]
rsr = "rsr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "device: requires an accelerator (MPS or CUDA); skipped on CPU-only lanes",
    "slow: takes more than ~10s",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Greek letters and math signs are this project's vocabulary, not confusables. The spec names
# gamma, beta, nu, psi, rho, tau and lambda by their symbols throughout; transliterating them in
# docstrings would make the code harder to check against the document it implements.
allowed-confusables = ["\u03b1", "\u03b2", "\u03b3", "\u03bb", "\u03bd", "\u03c1", "\u03c4",
                       "\u03c8", "\u0394", "\u03a3", "\u00d7", "\u2013", "\u2014", "\u2264",
                       "\u2265", "\u2248", "\u00b7"]
